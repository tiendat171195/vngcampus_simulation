name: Deploy

# Images for every push to the main branch and every version tag (docs/09 §4). Staging follows
# the main branch; production takes a version tag and waits for approval in the "production"
# environment (Settings → Environments → required reviewers). Without the servers configured
# (repository variables STAGING_HOST / PRODUCTION_HOST), only the images are built.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.IMAGE_REPO }}/api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=campus
          cache-to: type=gha,scope=campus,mode=max

      - name: Build and push realtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: realtime
          push: true
          tags: ${{ env.IMAGE_REPO }}/realtime:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=campus

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.IMAGE_REPO }}/web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=campus

  staging:
    name: Deploy to staging
    needs: images
    if: github.ref == 'refs/heads/main' && vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        env:
          HOST: ${{ vars.STAGING_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ needs.images.outputs.tag }}
        run: infra/deploy.sh

  production:
    name: Deploy to production
    needs: images
    if: startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        env:
          HOST: ${{ vars.PRODUCTION_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ needs.images.outputs.tag }}
        run: infra/deploy.sh
