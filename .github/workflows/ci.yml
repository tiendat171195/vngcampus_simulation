name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported runtime, 24 is the production target.
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus -d campus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://campus:campus@localhost:5432/campus_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Known vulnerabilities in production dependencies
        if: matrix.node == 24
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the web download budget
        run: pnpm budget

      - name: Smoke-test the built servers
        run: pnpm smoke

  images:
    name: Production images and stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@v4

      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: campus/api:ci
          cache-from: type=gha,scope=campus
          cache-to: type=gha,scope=campus,mode=max

      - name: Build the realtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: realtime
          load: true
          tags: campus/realtime:ci
          cache-from: type=gha,scope=campus

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: campus/web:ci
          cache-from: type=gha,scope=campus

      - name: Start the production stack and check it through Caddy
        run: infra/smoke-stack.sh
        env:
          IMAGE_REPO: campus
          IMAGE_TAG: ci

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus -d campus_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://campus:campus@localhost:5432/campus_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @campus/e2e exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
