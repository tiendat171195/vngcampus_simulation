packages:
  - apps/*
  - packages/*
  - tools/*
  - tests/*

# Versions shared by more than one package live here; reference them with "catalog:".
catalog:
  "@biomejs/biome": 2.6.7
  "@types/node": ^22.20.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: ^0.23.7
  tsx: ^4.23.15
  turbo: ^2.11.11
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.0
  zod: ^4.6.7

# Packages allowed to run install scripts (pnpm blocks them by default).
onlyBuiltDependencies:
  - esbuild

# Optional native speed-up for msgpackr; the pure JS fallback is fine.
ignoredBuiltDependencies:
  - msgpackr-extract
