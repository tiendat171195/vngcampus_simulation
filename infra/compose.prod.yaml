# Production on one machine (docs/09 §2, tier 0). Run from this directory:
#   docker compose --env-file prod.env -f compose.prod.yaml up -d
# See docs/runbook.md for the first install, deploys, rollbacks and restores.
name: campus

x-app: &app
  restart: unless-stopped
  env_file: prod.env
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: campus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies migrations, then exits; the API and realtime start after it succeeds.
  migrate:
    image: ${IMAGE_REPO:-ghcr.io/example/campus}/api:${IMAGE_TAG:-latest}
    env_file: prod.env
    command: ["node", "dist/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    image: ${IMAGE_REPO:-ghcr.io/example/campus}/api:${IMAGE_TAG:-latest}

  realtime:
    <<: *app
    image: ${IMAGE_REPO:-ghcr.io/example/campus}/realtime:${IMAGE_TAG:-latest}
    # Colyseus drains rooms on SIGTERM; give it time before the kill.
    stop_grace_period: 30s

  web:
    image: ${IMAGE_REPO:-ghcr.io/example/campus}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: campus
      PGDATABASE: campus
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # Unhealthy when the last good dump is older than 26 hours: an alert, not a restart.
    healthcheck:
      test: ["CMD-SHELL", "find /backups/last-success -mmin -1560 | grep -q ."]
      interval: 5m
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
